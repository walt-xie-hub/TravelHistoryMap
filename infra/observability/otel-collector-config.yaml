# OpenTelemetry Collector 配置
# 开发环境：接收应用遥测 → 处理后分发到 Jaeger / Prometheus / Console
#
# 架构：
#   user-service (.NET OTel SDK)
#       │  OTLP/gRPC
#       ▼
#   otel-collector (receivers → processors → exporters)
#       │                  │
#       ▼                  ▼
#   Jaeger (Traces)    Prometheus (Metrics)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317         # OTLP gRPC 接收端口
      http:
        endpoint: 0.0.0.0:4318         # OTLP HTTP 接收端口

processors:
  # 批量处理器：累积 Span 后批量导出，减少 Jaeger 的网络请求次数
  batch:
    timeout: 1s
    send_batch_size: 1024

  # 内存限制器：防止 Collector 自身 OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # 属性脱敏：删除凭据类请求头，避免 token 通过 trace / log 外泄。
  # 这一段必须保持开启：它曾以"生产环境可按需打开"为由被注释掉，
  # 结果是本地 collector 的 debug 输出与 Jaeger 里都带着 Authorization 头。
  attributes:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete

exporters:
  # Traces → Jaeger（OTLP/gRPC）
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics → Prometheus scrape 端点（备选；当前 Prometheus 直接抓 App /metrics）
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logs → Loki（通过 OTLP HTTP 协议推送，Loki 2.9+ 原生支持）
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # 开发调试：输出到控制台，便于诊断。
  # 刻意用 basic 而非 detailed：detailed 会把完整 span/log 内容（含属性）刷到容器
  # stdout，是最直接的泄露面。需要看完整内容时用 Jaeger（traces）或 Grafana/Loki（logs）。
  # 任何共享/生产环境配置都不得包含本 exporter。
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [otlphttp/loki, debug]
