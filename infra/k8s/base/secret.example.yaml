apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: myapp
type: Opaque
stringData:
  Db__Password: replace-with-database-password
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=replace-with-database-password;Pooling=true
  Jwt__Key: replace-with-a-long-random-signing-key
