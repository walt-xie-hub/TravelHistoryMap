# k8s/base/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: myapp
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # OpenTelemetry OTLP 导出目标（生产环境部署 OpenTelemetry Collector 后填写）
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "user-service"
