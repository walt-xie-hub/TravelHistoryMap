apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-service
  namespace: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-service
  template:
    metadata:
      labels:
        app: travel-service
    spec:
      containers:
      - name: travel-service
        image: travel-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        env:
        - name: OTEL_SERVICE_NAME
          value: travel-service
        - name: TravelMedia__RootPath
          value: /app/media
        volumeMounts:
        - name: travel-media
          mountPath: /app/media
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: travel-media
        persistentVolumeClaim:
          claimName: travel-media
