# k8s/base/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: myapp
type: Opaque
stringData:
  # 与 compose 完全一致的数据库账号，确保两套环境身份统一
  Db__Password: "123456"
  # .NET 环境变量映射：ConnectionStrings__DefaultConnection -> ConnectionStrings:DefaultConnection
  # （与 AddInfrastructure 里 GetConnectionString("DefaultConnection") 对齐）
  # Host=postgres 由 CoreDNS 解析为 k8s 内的 postgres Service
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=123456;Pooling=true"
