# ─────────────────────────────────────────────────────────────
# 本地开发栈。安全约定（见 docs/security/observability-and-audit.md 的 P0 项）：
#   - 宿主端口一律只绑定 127.0.0.1：dev 服务不应暴露给同网段的其它机器。
#     观测栈尤其如此（Jaeger / Prometheus / Loki / Collector 都没有鉴权）。
#   - 不提交任何默认口令：GRAFANA_ADMIN_PASSWORD 与其它密钥一样由 .env 提供，
#     缺失即启动失败——避免"忘了改"直接变成线上默认凭据。
# ─────────────────────────────────────────────────────────────
services:
  # Angular 开发服务器（热重载）：运行 ng serve，源码随宿主变更实时同步进容器
  client:
    build:
      context: ./src/frontend/client
      dockerfile: Dockerfile.dev
    container_name: angular-client-dev
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      - NODE_ENV=development
      # 让 chokidar 在挂载文件系统上用轮询检测文件变更
      - CHOKIDAR_USEPOLLING=true
    develop:
      watch:
        # 源码变更 → 同步进容器，由 ng serve 热重载
        - action: sync
          path: ./src/frontend/client
          target: /app
          ignore:
            - node_modules
            - dist
            - .angular
        # 依赖变更 → 重建镜像
        - action: rebuild
          path: ./src/frontend/client/package.json
        - action: rebuild
          path: ./src/frontend/client/package-lock.json
    networks:
      - dev-net

  # .NET WebAPI（热重载）：运行 dotnet watch，源码随宿主变更实时同步并自动重新编译
  # 数据库用本服务下方的 db（postgres:16-alpine）。
  # 关键点：db 的数据目录 ./database/postgres 与 k8s 的 PV hostPath
  # 指向同一份物理文件，所以无论用 compose 还是 k8s 启动，操作的都是
  # 同一个 appdb 库。注意：同一时间只跑一套，避免两个 PG 写同一目录。
  server:
    build:
      context: ./src/backend
      dockerfile: services/user-service/Dockerfile.dev
    container_name: dotnet-api-dev
    ports:
      # 与 client 开发环境 environment.ts 的 apiBaseUrl(http://localhost:8080/api) 对齐
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      # 连接本服务的 db（与 k8s 共享同一份数据目录）。
      # 注意：.NET 用 GetConnectionString("DefaultConnection")，
      # 所以 env 必须命名为 ConnectionStrings__DefaultConnection
      # （__ 映射为 :，对应配置键 ConnectionStrings:DefaultConnection）
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=appdb;Username=appuser;Password=${DB_PASSWORD:?DB_PASSWORD is required};Pooling=true;
      - Db__Password=${DB_PASSWORD:?DB_PASSWORD is required}
      # JWT（ADR-0005）：travel-server 用同一组值做验证；生产由 k8s secret 注入
      - Jwt__Key=${JWT_KEY:?JWT_KEY is required}
      - Jwt__Issuer=travel-map
      - Jwt__Audience=travel-map-client
      # 令牌校验（ADR-0021）：RS256 公钥经该 issuer 的 OIDC 发现获取。
      # 旧 HS256 **默认不接受**；只有在需要接受旧令牌时才把下面两行打开，且日期必须未过期、
      # 距今不超过 7 天，否则服务会拒绝启动（fail closed）。本地调试旧令牌才需要：
      #   - Jwt__AllowLegacyHs256=true
      #   - Jwt__LegacyUntil=2026-09-25T00:00:00Z
      - Identity__Issuer=http://identity-service:8080/identity
      # 服务身份（ADR-0022）：ClientId/Issuer 在 appsettings.json，这里只注入 secret。
      - ServiceIdentity__ClientSecret=${USER_SERVICE_CLIENT_SECRET:?USER_SERVICE_CLIENT_SECRET is required}
      - DemoUser__Password=${DEMO_USER_PASSWORD:?DEMO_USER_PASSWORD is required}
      # OpenTelemetry OTLP 导出目标：Collector → Jaeger
      # 使用 gRPC 协议 (:4317)，先经过 Collector 做批量/过滤/路由处理
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=user-service
    # 等到 db 健康（Postgres 真正可连接）后才启动，避免启动竞态
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # 源码变更 → 同步进容器（含 services/user-service 与 shared/），
        # 由 dotnet watch 自动重新编译并重启
        - action: sync
          path: ./src/backend
          target: /src
          ignore:
            - bin
            - obj
        # Dockerfile 变更 → 重建镜像
        - action: rebuild
          path: ./src/backend/services/user-service/Dockerfile.dev
    networks:
      - dev-net

  # travel-history WebAPI（热重载）：镜像 user-service 的 server 开发模式。
  # 与 user-service 共享同一个 appdb（见 src/backend/services/travel-history/src/
  # Travel.Infrastructure/Persistence/DatabaseInitializer.cs 的共享引导，docs/adr/0002）。
  travel-server:
    build:
      context: ./src/backend
      dockerfile: services/travel-history/Dockerfile.dev
    container_name: travel-api-dev
    ports:
      # 避开 user-service 的 8080；前端调用走网关时再统一到 80/443（见 nginx.conf.template）
      - "127.0.0.1:8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      # 连接本服务的 db（与 k8s 共享同一份数据目录）。
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=appdb;Username=appuser;Password=${DB_PASSWORD:?DB_PASSWORD is required};Pooling=true;
      - Db__Password=${DB_PASSWORD:?DB_PASSWORD is required}
      # JWT（ADR-0005）：与 user-service 共享签名密钥，仅做验证不签发
      - Jwt__Key=${JWT_KEY:?JWT_KEY is required}
      - Jwt__Issuer=travel-map
      - Jwt__Audience=travel-map-client
      # 令牌校验（ADR-0021）：RS256 公钥经该 issuer 的 OIDC 发现获取；旧 HS256 默认不接受
      # （要接受需打开 Jwt__AllowLegacyHs256 + Jwt__LegacyUntil，上限 7 天）。
      - Identity__Issuer=http://identity-service:8080/identity
      # 服务身份（ADR-0022）：ClientId/Issuer 在 appsettings.json，这里只注入 secret。
      - ServiceIdentity__ClientSecret=${TRAVEL_SERVICE_CLIENT_SECRET:?TRAVEL_SERVICE_CLIENT_SECRET is required}
      # OpenTelemetry OTLP 导出目标：Collector → Jaeger
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=travel-service
      - TravelMedia__RootPath=/app/media
    volumes:
      - ./data/travel-media:/app/media
    # 等到 db 健康（Postgres 真正可连接）后才启动，避免启动竞态。
    # user-service 同时也在引导共享库 schema；travel 侧 DatabaseInitializer 自带重试，
    # 可容忍 Users 表/外键尚未就绪的启动顺序问题。
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # 源码变更 → 同步进容器（含 services/travel-history 与 shared/），
        # 由 dotnet watch 自动重新编译并重启
        - action: sync
          path: ./src/backend
          target: /src
          ignore:
            - bin
            - obj
        # Dockerfile 变更 → 重建镜像
        - action: rebuild
          path: ./src/backend/services/travel-history/Dockerfile.dev
    networks:
      - dev-net

  # identity-service：认证与令牌（ADR-0020/0021）。只读 user-service 的 Users 凭据列，
  # 不拥有 User；签发 RS256 令牌，并把公钥经 JWKS / OIDC 发现公布。
  identity-service:
    build:
      context: ./src/backend
      dockerfile: services/identity-service/Dockerfile.dev
    container_name: identity-api-dev
    ports:
      # 宿主 8090：前端 environment.ts 的 identityBaseUrl 指向这里
      - "127.0.0.1:8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      # 数据库：用的是**独立的只读角色**（ADR-0020），不是 appuser。
      # 因此 identity-service 拿不到库属主的口令，即使被攻陷也写不了 Users ——
      # 这条约束由 PostgreSQL 权限系统兜住，不再只是"我们的代码里没有写语句"。
      # 角色由一次性步骤创建（幂等，可反复跑）：
      #   docker compose up -d db server && pwsh -File scripts/provision-identity-db-role.ps1
      # 注意：这里**不能**给 Db__Password（那是 appuser 的口令）。
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=appdb;Username=identity_service;Password=${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required};Pooling=true;
      # issuer 必须与资源服务校验时用的值**逐字一致**；容器间用服务名互访，
      # 浏览器则走宿主 8090（第一期前端不做发现，只调登录/验证码）。
      - Identity__Issuer=http://identity-service:8080/identity
      - Identity__Audience=travel-map-client
      # 服务客户端清单（ClientId/audience）在 appsettings.json；这里只按同一顺序注入 secret，
      # 顺序必须与 Identity:ServiceClients 数组一致（下标即绑定）。
      - Identity__ServiceClients__0__ClientSecret=${USER_SERVICE_CLIENT_SECRET:?USER_SERVICE_CLIENT_SECRET is required}
      - Identity__ServiceClients__1__ClientSecret=${TRAVEL_SERVICE_CLIENT_SECRET:?TRAVEL_SERVICE_CLIENT_SECRET is required}
      - Identity__ServiceClients__2__ClientSecret=${IDENTITY_SERVICE_CLIENT_SECRET:?IDENTITY_SERVICE_CLIENT_SECRET is required}
      - Identity__SigningKeyStore__Provider=Development
      - Identity__SigningKeyStore__Path=/app/keys
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=identity-service
    volumes:
      # 签名密钥落宿主：容器重启不会换钥匙（否则每次重启都让所有人掉线）
      - ./data/identity-keys:/app/keys
    # 等 db 健康后再启动：本服务启动时要读 Users 表的凭据列
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src/backend
          target: /src
          ignore:
            - bin
            - obj
        - action: rebuild
          path: ./src/backend/services/identity-service/Dockerfile.dev
    networks:
      - dev-net

  # PostgreSQL —— 数据目录与 k8s PV 共享同一物理位置（见 k8s/postgres/postgres-pv.yaml）
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./database/postgres:/var/lib/postgresql/data
    # 健康检查：Postgres 完成 init 并监听 5432 后才算 healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dev-net

  # Jaeger All-in-One：trace 可视化，由 Collector 转发数据
  # 仅暴露 UI 端口；OTLP 接收改由 otel-collector 代理
  jaeger:
    image: jaegertracing/all-in-one:1
    container_name: jaeger
    restart: always
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      # 4317/4318 不再暴露到宿主，仅 dev-net 内部供 Collector 连接
    expose:
      - "4317"
      - "4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - dev-net

  # OpenTelemetry Collector：应用遥测的中转/处理层
  # 接收所有 OTLP 数据 → processors(批量/过滤/路由) → exporters(Jaeger/Prometheus)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"     # OTLP gRPC（应用发到这里）
      - "127.0.0.1:4318:4318"     # OTLP HTTP
      - "127.0.0.1:8889:8889"     # Prometheus scrape（Collector 自身 metrics）
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - dev-net

  # Prometheus：抓取 /metrics 端点，存储时序数据
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"     # Prometheus UI / API
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 刻意不开 --web.enable-lifecycle：它会让任意可达者用 POST /-/reload 触发配置重载
    networks:
      - dev-net

  # Loki：日志聚合存储，接收 OTel Collector 推送的结构化日志
  # Grafana 中以 Loki 为数据源即可查询、搜索、过滤日志
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "127.0.0.1:3100:3100"     # Loki HTTP API
    volumes:
      - ./infra/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - dev-net

  # Grafana：时序数据 + 日志可视化，预置 Prometheus + Loki 数据源
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000"     # Grafana UI
    environment:
      # 不再提交默认口令（原为 admin/admin，README 里还明文写着）。
      # 与 DB_PASSWORD 同规格：缺失即启动失败，避免"忘了改"变成事实上的默认凭据。
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./infra/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - dev-net

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  dev-net:
    driver: bridge
