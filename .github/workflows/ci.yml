# ──────────────────────────────────────────────
# CI：构建 + 单元测试（不涉及部署，不需要任何 secrets）
#
# 触发时机：
#   - push 到 main 分支
#   - 创建/更新 Pull Request
#   - 手动触发（仓库 Actions 页面点 "Run workflow" 按钮）
#
# 两个任务并行执行：
#   backend  —— .NET 10 后端：restore → build → test（xUnit）
#   frontend —— Angular 前端：npm ci → 生产构建 → 单元测试（vitest）
# ──────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── 后端：.NET 10 ──────────────────────────
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        # 让下面所有 run 步骤默认在 src/backend 下执行
        working-directory: src/backend
    steps:
      # 1. 拉取代码（每个 workflow 的第一步）
      - uses: actions/checkout@v5

      # 2. 安装 .NET SDK（10.0.x = 最新 10.0 补丁版本）
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. 还原 NuGet 依赖
      - name: Restore
        run: dotnet restore backend.slnx

      # 4. Release 编译（--no-restore：依赖上一步已还原，加快速度）
      - name: Build
        run: dotnet build backend.slnx -c Release --no-restore

      # 5. 运行 xUnit 单元测试（--no-build：用上一步的编译产物）
      - name: Test
        run: dotnet test backend.slnx -c Release --no-build --no-restore

  # ── 前端：Angular ──────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        # 所有 run 步骤默认在 src/frontend/client 下执行
        working-directory: src/frontend/client
    steps:
      - uses: actions/checkout@v5

      # 2. 安装 Node 24（与前端 Dockerfile 的 node:24-alpine 对齐）
      #    cache: npm 会自动缓存 npm 依赖，下次跑更快
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/client/package-lock.json

      # 3. 按 package-lock.json 精确安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 生产构建（ng build 默认即 production 配置，产物在 dist/）
      - name: Build (production)
        run: npm run build

      # 5. 单元测试（vitest；CI 环境下自动非 watch 模式）
      - name: Unit tests
        run: npx ng test --watch=false
