# ──────────────────────────────────────────────
# CI/CD：Docker 镜像构建验证（build + 单元测试）+ 部署到 Azure Container Apps
#
# 设计原则：Dockerfile 是构建的"唯一事实来源"。
#   依赖安装、编译、单元测试都已经写进 Dockerfile 的 build 阶段
#   （后端 dotnet test、前端 ng test），测试失败会中断镜像构建。
#   因此 CI 只需要 docker build 三个镜像，即可完成全部验证，
#   且与本地 docker build 的结果完全一致。
#
# 部署：镜像 push 到 ghcr.io（GitHub Container Registry），再用
#   azure/containerapps-deploy 更新 Azure Container Apps：
#   - user-service  → 后端 API（.NET，internal 入口）
#   - client        → 前端静态站（nginx，internal 入口）
#   - gateway       → nginx 统一入口（复刻 K8s ingress 的路径分流：
#                      /api/* → user-service，/* → client，唯一 external 入口）
#   免费方案：镜像设 public 免认证拉取；Container Apps min-replicas 0 缩容到零。
#
# 触发时机：
#   - push 到 main 分支（构建 + 测试 + 部署）
#   - 创建/更新 Pull Request（仅构建 + 测试，不部署）
#   - 手动触发（仓库 Actions 页面点 "Run workflow" 按钮）
#
# secrets 说明：部署需要仓库 Settings → Secrets 里配置以下五项
#   （前三项由 Azure 门户创建 OIDC 联邦凭据时生成；后两项用于 Container Apps 拉取私有 GHCR 镜像）：
#   AZUREAPPSERVICE_CLIENTID_3E4B653535F64E518FC068312A4ACF78
#   AZUREAPPSERVICE_TENANTID_A2B2CD6D4C5C4A77B27AE5DA70E292AE
#   AZUREAPPSERVICE_SUBSCRIPTIONID_12264A5C94164B61945E7CA2E9EEE253
#   GHCR_USERNAME          # GitHub 用户名，用于 Azure 拉取私有 ghcr.io 镜像
#   GHCR_PASSWORD          # GitHub Personal Access Token（至少 read:packages）
#
# 部署前置条件（一次性，az CLI 完成）：
#   rg-travelmap 资源组 / cae-travelmap 环境 / 三个 Container App 已创建；
#   gateway 配置 USER_SERVICE_URL、TRAVEL_SERVICE_URL、CLIENT_URL（internal 服务地址）；
#   user-service 配置 db-password secret 与 PostgreSQL 连接串；
#   PostgreSQL Flexible Server（B1ms 免费层）。
# ──────────────────────────────────────────────
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 仓库已迁移到组织 walt-xie-hub，镜像命名空间跟随仓库 owner
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/travelmap-client
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/travelmap-user-service
  TRAVEL_IMAGE: ghcr.io/${{ github.repository_owner }}/travelmap-travel-service
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/travelmap-gateway
  RESOURCE_GROUP: travelMap

jobs:
  # ───────────── ① 构建 + 测试（质量门禁）─────────────
  docker-build:
    name: Docker Images (build + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push 镜像到 ghcr.io 必需（PR 只构建不 push）
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v5

      # 2. 启用 BuildKit 构建器（docker-container driver），
      #    这是 build-push-action 与 gha 缓存（cache-from/cache-to）的前置
      - uses: docker/setup-buildx-action@v4

      # 3. 登录 GHCR（GITHUB_TOKEN 自动提供，无需 PAT）
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 镜像 tag 用 commit 短 SHA，支持回滚
      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure frontend runtime secrets
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          AMAP_SECURITY_JS_CODE: ${{ secrets.AMAP_SECURITY_JS_CODE }}
        run: |
          cat > src/frontend/client/public/runtime-config.js <<EOF
          window.__TRAVEL_MAP_CONFIG__ = {
            amapKey: '${AMAP_KEY}',
            amapSecurityJsCode: '${AMAP_SECURITY_JS_CODE}',
          };
          EOF

      # 5. 前端镜像：npm ci → 生产构建 → 单测 → nginx 托管
      #    PR 只构建验证，push 到 main 才推送镜像
      - name: Build & push client
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend/client
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.CLIENT_IMAGE }}:${{ steps.meta.outputs.tag }},${{ env.CLIENT_IMAGE }}:latest
          # gha 缓存：层缓存存 GitHub Actions cache，scope 区分镜像避免互相覆盖
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 6. 后端镜像：restore → 单测 → publish 全部在容器内完成
      #    context 必须是 src/backend（Dockerfile 里 COPY 了 services/ 与 shared/）
      - name: Build & push user-service
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          file: ./src/backend/services/user-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.tag }},${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push travel-service
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          file: ./src/backend/services/travel-history/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.TRAVEL_IMAGE }}:${{ steps.meta.outputs.tag }},${{ env.TRAVEL_IMAGE }}:latest
          cache-from: type=gha,scope=travel-backend
          cache-to: type=gha,mode=max,scope=travel-backend

      # 7. 网关镜像：nginx 统一入口（配置经环境变量注入，见 src/gateway）
      - name: Build & push gateway
        uses: docker/build-push-action@v7
        with:
          context: ./src/gateway
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.GATEWAY_IMAGE }}:${{ steps.meta.outputs.tag }},${{ env.GATEWAY_IMAGE }}:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # 8. 镜像默认可见性与仓库一致；仓库为私有时要显式设成 public，
      #    否则 Container Apps 拉取需要额外凭证（免费方案依赖 public 镜像免认证拉取）
      - name: Set package visibility to public
        if: github.event_name != 'pull_request' && github.repository_visibility == 'private'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for img in travelmap-client travelmap-user-service travelmap-travel-service travelmap-gateway; do
            gh api -X PATCH "orgs/${{ github.repository_owner }}/packages/container/$img" -f visibility=public
          done

  # ───────────── ② 部署到 Azure Container Apps ─────────────
  deploy:
    name: Deploy to Azure Container Apps
    needs: docker-build                    # 测试/构建通过才部署
    if: github.event_name != 'pull_request'   # PR 只验证，不部署
    runs-on: ubuntu-latest
    permissions:
      id-token: write                      # OIDC 登录 Azure 需要请求 JWT
      contents: read
    steps:
      # 无密码登录：OIDC 联邦凭据（client-id/tenant-id/subscription-id 三项 secret）
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3E4B653535F64E518FC068312A4ACF78 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2B2CD6D4C5C4A77B27AE5DA70E292AE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_12264A5C94164B61945E7CA2E9EEE253 }}

      # 更新已有 Container App 的镜像（仅更新镜像，不动运行配置）。
      # 应用的 env/secrets（数据库连接串、JWT、内部服务地址等）在 ACA 上一次性配置，
      # 由 deploy-azure.sh / 手动 az 维护；CI 用 az containerapp update 只替换镜像，
      # 避免整段配置替换清空 user-service / travel-service 的启动参数。
      # 镜像为 ghcr public，无需 registry 凭据即可拉取。
      - name: Update app images
        run: |
          tag="${{ needs.docker-build.outputs.tag }}"
          ns="${{ github.repository_owner }}"
          az containerapp update -n user-service   -g "${{ env.RESOURCE_GROUP }}" --image "ghcr.io/$ns/travelmap-user-service:$tag"
          az containerapp update -n client        -g "${{ env.RESOURCE_GROUP }}" --image "ghcr.io/$ns/travelmap-client:$tag"
          az containerapp update -n travel-service -g "${{ env.RESOURCE_GROUP }}" --image "ghcr.io/$ns/travelmap-travel-service:$tag"
          az containerapp update -n gateway       -g "${{ env.RESOURCE_GROUP }}" --image "ghcr.io/$ns/travelmap-gateway:$tag"
