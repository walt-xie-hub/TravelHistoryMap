# ──────────────────────────────────────────────
# CI/CD：Docker 镜像构建验证（build + 单元测试）+ 部署到 Azure
#
# 设计原则：Dockerfile 是构建的"唯一事实来源"。
#   依赖安装、编译、单元测试都已经写进两个 Dockerfile 的 build 阶段
#   （后端 dotnet test、前端 ng test），测试失败会中断镜像构建。
#   因此 CI 只需要 docker build 两个镜像，即可完成全部验证，
#   且与本地 docker build 的结果完全一致。
#
# 部署：不重复构建，直接从 user-service 镜像里提取 dotnet publish 产物
#   （/app/out），zip 部署到 Azure App Service "TravelHistoryMap"。
#   部署信息（OIDC secrets、azure/login、webapps-deploy、app-name）
#   参考原 main_travelhistorymap.yml（Azure 部署向导自动生成）。
#
# 触发时机：
#   - push 到 main 分支（构建 + 测试 + 部署）
#   - 创建/更新 Pull Request（仅构建 + 测试，不部署）
#   - 手动触发（仓库 Actions 页面点 "Run workflow" 按钮）
#
# secrets 说明：部署需要仓库 Settings → Secrets 里配置以下三项
#   （Azure 向导创建 App Service 时已自动生成，无需手动添加）：
#   AZUREAPPSERVICE_CLIENTID_AA776FAA87AC4876941A37B1963F324A
#   AZUREAPPSERVICE_TENANTID_82C2B4EA60294E959F2689F91C024F43
#   AZUREAPPSERVICE_SUBSCRIPTIONID_842056D8DC054D74B9D121D85B480A8C
# ──────────────────────────────────────────────
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ───────────── ① 构建 + 测试（质量门禁）─────────────
  docker-build:
    name: Docker Images (build + test)
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v5

      # 2. 启用 BuildKit 构建器（docker-container driver），
      #    这是 build-push-action 与 gha 缓存（cache-from/cache-to）的前置
      - uses: docker/setup-buildx-action@v4

      # 3. 后端镜像：restore → 单测 → publish 全部在容器内完成
      #    context 必须是 src/backend（Dockerfile 里 COPY 了 services/ 与 shared/）
      #    load: true → 把镜像载入本地 daemon，供下一步 docker cp 提取发布产物
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          file: ./src/backend/services/user-service/Dockerfile
          push: false                      # 只构建验证，不推送
          tags: user-service:ci
          load: true
          # gha 缓存：层缓存存 GitHub Actions cache，下次跑直接复用
          # scope 区分两个镜像，避免缓存互相覆盖
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # 4. 前端镜像：npm ci → 生产构建 → 单测 → nginx 托管
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend/client
          file: ./src/frontend/client/Dockerfile
          push: false
          tags: client:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 5. 从镜像里提取 dotnet publish 产物，保证部署包与镜像内容完全一致
      #    —— 不重复构建，符合"唯一构建真相"。
      #    注意路径是 /app 而不是 /app/out：publish 的 -o /app/out 在 build 阶段，
      #    最终镜像（runtime 阶段）是 WORKDIR /app + COPY --from=build /app/out ./，
      #    产物（user.dll、web.config 等）直接位于 /app 根目录下。
      - name: Extract backend publish output
        run: |
          docker create --name extract user-service:ci
          docker cp extract:/app/. ./publish
          docker rm extract

      # 6. 上传为 artifact，供 deploy job 下载
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
          if-no-files-found: error

  # ───────────── ② 部署到 Azure App Service ─────────────
  deploy:
    name: Deploy to Azure Web App
    needs: docker-build                    # 测试/构建通过才部署
    if: github.event_name != 'pull_request'   # PR 只验证，不部署
    runs-on: ubuntu-latest
    permissions:
      id-token: write                      # OIDC 登录 Azure 需要请求 JWT
      contents: read                       # 下载 artifact
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      # 无密码登录：OIDC 联邦凭据（client-id/tenant-id/subscription-id 三项 secret）
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3E4B653535F64E518FC068312A4ACF78 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2B2CD6D4C5C4A77B27AE5DA70E292AE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_12264A5C94164B61945E7CA2E9EEE253 }}

      # zip 部署到 App Service TravelHistoryMap 的 Production 槽位
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TravelHistoryMap'
          slot-name: 'Production'
          package: ./publish

      # 将来要改成容器化部署（ACR + Container Apps）时，
      # 把 docker-build 的 push 改为 true、加 docker/login-action@v3，
      # deploy 换成 azure/container-apps-deploy@v2 即可
