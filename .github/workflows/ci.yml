# ──────────────────────────────────────────────
# CI：Docker 镜像构建验证（build + 单元测试）
#
# 设计原则：Dockerfile 是构建的"唯一事实来源"。
#   依赖安装、编译、单元测试都已经写进两个 Dockerfile 的 build 阶段
#   （后端 dotnet test、前端 ng test），测试失败会中断镜像构建。
#   因此 CI 只需要 docker build 两个镜像，即可完成全部验证，
#   且与本地 docker build 的结果完全一致。
#
# 触发时机：
#   - push 到 main 分支
#   - 创建/更新 Pull Request
#   - 手动触发（仓库 Actions 页面点 "Run workflow" 按钮）
#
# 不需要任何 secrets（push: false，只构建不推送）。
# ──────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Images (build + test)
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v5

      # 2. 启用 BuildKit 构建器（docker-container driver），
      #    这是 build-push-action 与 gha 缓存（cache-from/cache-to）的前置
      - uses: docker/setup-buildx-action@v4

      # 3. 后端镜像：restore → 单测 → publish 全部在容器内完成
      #    context 必须是 src/backend（Dockerfile 里 COPY 了 services/ 与 shared/）
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          file: ./src/backend/services/user-service/Dockerfile
          push: false                      # 只构建验证，不推送
          tags: user-service:ci
          # gha 缓存：层缓存存 GitHub Actions cache，下次跑直接复用
          # scope 区分两个镜像，避免缓存互相覆盖
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # 4. 前端镜像：npm ci → 生产构建 → 单测 → nginx 托管
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend/client
          file: ./src/frontend/client/Dockerfile
          push: false
          tags: client:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 将来要推送到 Azure Container Registry（或 Docker Hub）时，
      # 在这两段之前加：
      #   - uses: docker/login-action@v3
      #     with:
      #       registry: <你的ACR>.azurecr.io
      #       username: ${{ secrets.ACR_USERNAME }}
      #       password: ${{ secrets.ACR_PASSWORD }}
      # 然后把 push 改为 true、tags 改成完整镜像地址即可
