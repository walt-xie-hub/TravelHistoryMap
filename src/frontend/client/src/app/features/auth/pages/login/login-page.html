<form class="auth-card" (submit)="submit($event)" novalidate>
  <div class="auth-card__brand">
    <div class="auth-card__logo" aria-hidden="true">🧭</div>
    <h1 class="auth-card__title">{{ appName }}</h1>
    <p class="auth-card__subtitle">登录后查看你的旅行足迹</p>
  </div>

  @if (successMessage(); as message) {
    <div class="auth-card__success" role="status">{{ message }}</div>
  }
  @if (errorMessage(); as message) {
    <div class="auth-card__error" role="alert">{{ message }}</div>
  }

  <label class="field">
    <span class="field__label">邮箱</span>
    <input
      class="field__control"
      type="email"
      name="email"
      autocomplete="email"
      placeholder="you@example.com"
      [value]="email()"
      (input)="onEmailChange($event)"
      (blur)="onEmailBlur()"
      required
    />
    @if (emailHint(); as hint) {
      <span class="field__hint field__hint--error">{{ hint }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">密码</span>
    <input
      class="field__control"
      type="password"
      name="password"
      autocomplete="current-password"
      placeholder="请输入密码"
      [value]="password()"
      (input)="onPasswordChange($event)"
      (blur)="onPasswordBlur()"
      required
    />
    @if (passwordHint(); as hint) {
      <span class="field__hint field__hint--error">{{ hint }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">图片验证码</span>
    <div class="captcha-row">
      <input
        class="field__control captcha-row__input"
        type="text"
        name="captcha"
        inputmode="numeric"
        autocomplete="off"
        maxlength="4"
        placeholder="输入图中数字"
        [value]="captcha()"
        (input)="onCaptchaChange($event)"
        (blur)="onCaptchaBlur()"
        required
      />
      <button
        type="button"
        class="captcha-row__image"
        [disabled]="captchaLoading()"
        (click)="loadCaptcha()"
        title="看不清？点击刷新验证码"
        aria-label="刷新验证码"
      >
        @if (captchaImage(); as src) {
          <img [src]="src" alt="验证码图片" />
        } @else {
          <span class="captcha-row__placeholder">{{ captchaLoading() ? '加载中…' : '刷新' }}</span>
        }
      </button>
    </div>
    @if (captchaHint(); as hint) {
      <span class="field__hint field__hint--error">{{ hint }}</span>
    }
  </label>

  <button class="auth-card__submit" type="submit" [disabled]="submitting()">
    {{ submitting() ? '登录中…' : '登 录' }}
  </button>

  <p class="auth-card__footer">
    还没有账号？<a routerLink="/register">立即注册</a>
  </p>
</form>
