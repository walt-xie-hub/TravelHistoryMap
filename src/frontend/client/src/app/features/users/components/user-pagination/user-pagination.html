@if (totalPages() > 0) {
  <div class="pagination">
    <div class="pagination__info">
      共 <strong>{{ totalCount() }}</strong> 条 · 第
      <strong>{{ page() }}</strong> / <strong>{{ totalPages() }}</strong> 页
    </div>

    <div class="pagination__controls">
      <button
        type="button"
        class="pg-btn"
        [disabled]="isFirst()"
        (click)="onPage(1)"
        aria-label="首页"
      >«</button>

      <button
        type="button"
        class="pg-btn"
        [disabled]="isFirst()"
        (click)="onPage(page() - 1)"
        aria-label="上一页"
      >‹</button>

      @for (p of pages(); track p) {
        <button
          type="button"
          class="pg-btn"
          [class.pg-btn--active]="p === page()"
          (click)="onPage(p)"
        >{{ p }}</button>
      }

      <button
        type="button"
        class="pg-btn"
        [disabled]="isLast()"
        (click)="onPage(page() + 1)"
        aria-label="下一页"
      >›</button>

      <button
        type="button"
        class="pg-btn"
        [disabled]="isLast()"
        (click)="onPage(totalPages())"
        aria-label="末页"
      >»</button>

      <label class="pagination__size">
        每页
        <select
          [value]="pageSize()"
          (change)="onPageSizeChange($event)"
        >
          @for (opt of pageSizeOptions; track opt) {
            <option [value]="opt">{{ opt }}</option>
          }
        </select>
        条
      </label>
    </div>
  </div>
}
