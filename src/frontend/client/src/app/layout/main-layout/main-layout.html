<div class="layout">
  <header class="layout__header">
    <a class="brand" routerLink="/home">
      <span class="brand__logo" aria-hidden="true">🧭</span>
      <span class="brand__name">{{ appName }}</span>
    </a>
    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav__link"
          [routerLink]="item.path"
          routerLinkActive="nav__link--active"
        >
          <span aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="user">
      <button
        type="button"
        class="user__toggle"
        (click)="toggleUserMenu()"
        aria-haspopup="menu"
        [attr.aria-expanded]="userMenuOpen()"
      >
        @if (user()?.avatarUrl; as avatarUrl) {
          <img
            class="user__avatar"
            [src]="avatarUrl"
            alt="头像"
            referrerpolicy="no-referrer"
          />
        } @else {
          <span class="user__avatar user__avatar--fallback">
            {{ userAvatarInitial() }}
          </span>
        }
        <span class="user__name">{{ user()?.name ?? '未登录' }}</span>
        <span class="user__chevron" aria-hidden="true">▾</span>
      </button>

      @if (userMenuOpen()) {
        <div class="user__backdrop" (click)="closeUserMenu()"></div>
        <div class="user__menu" role="menu">
          <button
            type="button"
            class="user__menu-item"
            role="menuitem"
            (click)="openProfile()"
          >
            <span aria-hidden="true">✏️</span>
            <span>修改用户信息</span>
          </button>
          <button
            type="button"
            class="user__menu-item user__menu-item--danger"
            role="menuitem"
            (click)="logout()"
          >
            <span aria-hidden="true">⏻</span>
            <span>登出</span>
          </button>
        </div>
      }
    </div>
  </header>

  <main class="layout__content">
    <router-outlet />
  </main>

  <footer class="layout__footer">
    <span>© {{ year }} {{ appName }}</span>
  </footer>

  <!-- 全局通知 -->
  <div class="toasts">
    @for (item of notification.items(); track item.id) {
      <div class="toast toast--{{ item.level }}" (click)="notification.dismiss(item.id)">
        {{ item.message }}
      </div>
    }
  </div>
</div>
