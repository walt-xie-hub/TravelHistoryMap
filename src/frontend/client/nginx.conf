# Angular SPA 的 nginx 配置。
# 关键：SPA history 回退 —— 找不到的路径（如 /login、/home、/map 及刷新）一律交给
# index.html，由 Angular 路由处理；否则直接访问深链会 404。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头。client 既可能经网关访问，也可能被同环境内的其它 app 直接访问
    # （ACA 的 internal 语义就是"环境内可达"），所以它自己不设安全头就没有纵深防护。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    # 与网关保持同一份策略：先 Report-Only，观察高德 SDK 实际需要哪些源之后再强制
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://webapi.amap.com https://*.amap.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://*.amap.com https://*.autonavi.com; font-src 'self' data:; frame-src 'self' https://*.amap.com" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html / runtime-config.js 不加长缓存，确保发布后可立即拿到新版本/新配置。
    # 这里刻意用 expires -1（等价于 Cache-Control: no-cache）而不是 add_header：
    # location 里只要出现 add_header，就会丢掉 server 级继承来的全部安全头。
    location = /index.html {
        expires -1;
    }
    location = /runtime-config.js {
        expires -1;
    }
}
